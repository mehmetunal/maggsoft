name: .NET 8 Auto Version and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Repository'i checkout et
      - uses: actions/checkout@v4

      # GitVersion kullanarak versiyon numarasýný hesapla
      - name: Install GitVersion
        run: dotnet tool install --global GitVersion.Tool

      - name: Determine Version
        id: gitversion
        run: gitversion /output json /showvariable FullSemVer

      # Versiyon numarasýný csproj dosyasýna ekle
      - name: Update project version
        run: |
          version=${{ steps.gitversion.outputs.FullSemVer }}
          echo "Setting version $version in .csproj"
          sed -i 's/<Version>.*<\/Version>/<Version>'"$version"'<\/Version>/' **/*.csproj

      # .NET projeyi pack et (otomatik versiyonla)
      - name: Pack .NET Project
        run: dotnet pack --configuration Release /p:PackageVersion=${{ steps.gitversion.outputs.FullSemVer }}

      
        # 7. NuGet veya GitHub Packages'e push et
      - name: Publish to GitHub Packages
        if: github.event_name == 'push'
        run: |
          dotnet nuget push **/bin/Release/*.nupkg --api-key ${{ secrets.PACKAGES_TOKEN }} --source https://nuget.pkg.github.com/mehmetunal/index.json

      # NuGet'e push et
      # - name: Push to NuGet
      #   run: |
      #     dotnet nuget push **/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json



