name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  changed_files:
    runs-on: ubuntu-latest  # windows-latest || macos-latest
    env:
        MaggsoftAspectCore: "src/Libraries/Aspect/Maggsoft.Aspect.Core/Maggsoft.Aspect.Core.csproj"
        MaggsoftCache: "src/Libraries/Cache/Maggsoft.Cache/Maggsoft.Cache.csproj"
        MaggsoftCacheMemoryCache: "src/Libraries/Cache/Maggsoft.Cache.MemoryCache/Maggsoft.Cache.MemoryCache.csproj"
        MaggsoftCacheRedis: "src/Libraries/Cache/Maggsoft.Cache.Redis/Maggsoft.Cache.Redis.csproj"
        MaggsoftData: "src/Libraries/Data/Maggsoft.Data/Maggsoft.Data.csproj"
        MaggsoftDataMongo: "src/Libraries/Data/Maggsoft.Data.Mongo/Maggsoft.Data.Mongo.csproj"
        MaggsoftDataMssql: "src/Libraries/Data/Maggsoft.Data.Mssql/Maggsoft.Data.Mssql.csproj"
        MaggsoftDataNpgsql: "src/Libraries/Data/Maggsoft.Data.Npgsql/Maggsoft.Data.Npgsql.csproj"
        MaggsoftDataSqlite: "src/Libraries/Data/Maggsoft.Data.Sqlite/Maggsoft.Data.Sqlite.csproj"
        MaggsoftDtoMongo: "src/Libraries/Dto/Maggsoft.Dto.Mongo/Maggsoft.Dto.Mongo.csproj"
        MaggsoftDtoMssql: "src/Libraries/Dto/Maggsoft.Dto.Mssql/Maggsoft.Dto.Mssql.csproj"
        MaggsoftDtoNpgsql: "src/Libraries/Dto/Maggsoft.Dto.Npgsql/Maggsoft.Dto.Npgsql.csproj"
        MaggsoftDtoSqlite: "src/Libraries/Dto/Maggsoft.Dto.Sqlite/Maggsoft.Dto.Sqlite.csproj"
        MaggsoftEndpoints: "src/Libraries/Endpoints/Maggsoft.Endpoints/Maggsoft.Endpoints.csproj"
        MaggsoftEventBus: "src/Libraries/EventBus/Maggsoft.EventBus/Maggsoft.EventBus.csproj"
        MaggsoftEventBusAzureServiceBus: "src/Libraries/EventBus/Maggsoft.EventBus.AzureServiceBus/Maggsoft.EventBus.AzureServiceBus.csproj"
        MaggsoftEventBusIoC: "src/Libraries/EventBus/Maggsoft.EventBus.IoC/Maggsoft.EventBus.IoC.csproj"
        MaggsoftEventBusRabbitMQ: "src/Libraries/EventBus/Maggsoft.EventBus.RabbitMQ/Maggsoft.EventBus.RabbitMQ.csproj"
        MaggsoftLogging: "src/Libraries/Logging/Maggsoft.Logging/Maggsoft.Logging.csproj"
        MaggsoftOcelotCore: "src/Libraries/Ocelot/Maggsoft.Ocelot.Core/Maggsoft.Ocelot.Core.csproj"
        MaggsoftMongoServices: "src/Libraries/Services/Maggsoft.Mongo.Services/Maggsoft.Mongo.Services.csproj"
        MaggsoftMssqlServices: "src/Libraries/Services/Maggsoft.Mssql.Services/Maggsoft.Mssql.Services.csproj"
        MaggsoftNpgsqlServices: "src/Libraries/Services/Maggsoft.Npgsql.Services/Maggsoft.Npgsql.Services.csproj"
        MaggsoftServices: "src/Libraries/Services/Maggsoft.Services/Maggsoft.Services.csproj"
        MaggsoftSqliteServices: "src/Libraries/Services/Maggsoft.Sqlite.Services/Maggsoft.Sqlite.Services.csproj"
        MaggsoftCore: "src/Libraries/Maggsoft.Core/Maggsoft.Core.csproj"
        MaggsoftMongo: "src/Libraries/Maggsoft.Mongo/Maggsoft.Mongo.csproj"
        MaggsoftMssql: "src/Libraries/Maggsoft.Mssql/Maggsoft.Mssql.csproj"
        MaggsoftNpgsql: "src/Libraries/Maggsoft.Npgsql/Maggsoft.Npgsql.csproj"
        MaggsoftSqlite: "src/Libraries/Maggsoft.Sqlite/Maggsoft.Sqlite.csproj"
        MaggsoftFramework: "src/Presentation/Maggsoft.Framework/Maggsoft.Framework.csproj"
    name: changed-files
    steps:
      - uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
      - name: List all changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
            COMMIT_COUNT=$(git rev-list --count HEAD)
            DATE=$(date +'%y%m%d')
            VERSION="1.0.${COMMIT_COUNT}-${DATE}"
            for file in ${ALL_CHANGED_FILES}; do
                if [[ "${file}" == *"Maggsoft.Aspect.Core/Maggsoft.Aspect.Core"* ]]; then
                   PROJECT=${{ env.MaggsoftAspectCore }}
                elif [[ "${file}" == *"Maggsoft.Cache/Maggsoft.Cache"* ]]; then
                   PROJECT=${{env.MaggsoftCache}}
                elif [[ "${file}" == *"Maggsoft.Cache.MemoryCache/Maggsoft.Cache.MemoryCache"* ]]; then
                   PROJECT=${{env.MaggsoftCacheMemoryCache}}
                elif [[ "${file}" == *"Maggsoft.Cache.Redis/Maggsoft.Cache.Redis"* ]]; then
                   PROJECT=${{env.MaggsoftCacheRedis}}
                elif [[ "${file}" == *"Maggsoft.Data/Maggsoft.Data"* ]]; then
                   PROJECT=${{env.MaggsoftData}}
                elif [[ "${file}" == *"Maggsoft.Data.Mongo/Maggsoft.Data.Mongo"* ]]; then
                   PROJECT=${{env.MaggsoftDataMongo}}
                elif [[ "${file}" == *"Maggsoft.Data.Mssql/Maggsoft.Data.Mssql"* ]]; then
                   PROJECT=${{env.MaggsoftDataMssql}}
                elif [[ "${file}" == *"Maggsoft.Data.Npgsql/Maggsoft.Data.Npgsql"* ]]; then
                   PROJECT=${{env.MaggsoftDataNpgsql}}
                elif [[ "${file}" == *"Maggsoft.Data.Sqlite/Maggsoft.Data.Sqlite"* ]]; then
                   PROJECT=${{env.MaggsoftDataSqlite}}
                elif [[ "${file}" == *"Maggsoft.Dto.Mongo/Maggsoft.Dto.Mongo"* ]]; then
                   PROJECT=${{env.MaggsoftDtoMongo}}
                elif [[ "${file}" == *"Maggsoft.Dto.Mssql/Maggsoft.Dto.Mssql"* ]]; then
                   PROJECT=${{env.MaggsoftDtoMssql}}
                elif [[ "${file}" == *"Maggsoft.Dto.Npgsql/Maggsoft.Dto.Npgsql"* ]]; then
                   PROJECT=${{env.MaggsoftDataNpgsql}}
                elif [[ "${file}" == *"Maggsoft.Dto.Sqlite/Maggsoft.Dto.Sqlite"* ]]; then
                   PROJECT=${{env.MaggsoftDtoSqlite}}
                elif [[ "${file}" == *"Maggsoft.Endpoints/Maggsoft.Endpoints"* ]]; then
                   PROJECT=${{env.MaggsoftEndpoints}}
                elif [[ "${file}" == *"Maggsoft.EventBus/Maggsoft.EventBus"* ]]; then
                   PROJECT=${{env.MaggsoftEventBus}}
                elif [[ "${file}" == *"Maggsoft.EventBus.AzureServiceBus/Maggsoft.EventBus.AzureServiceBus"* ]]; then
                   PROJECT=${{env.MaggsoftEventBusAzureServiceBus}}
                elif [[ "${file}" == *"Maggsoft.EventBus.IoC/Maggsoft.EventBus.IoC"* ]]; then
                   PROJECT=${{env.MaggsoftEventBusIoC}}
                elif [[ "${file}" == *"Maggsoft.EventBus.RabbitMQ/Maggsoft.EventBus.RabbitMQ"* ]]; then
                   PROJECT=${{env.MaggsoftEventBusRabbitMQ}}
                elif [[ "${file}" == *"Maggsoft.Logging/Maggsoft.Logging"* ]]; then
                   PROJECT=${{env.MaggsoftLogging}}
                elif [[ "${file}" == *"Maggsoft.Ocelot.Core/Maggsoft.Ocelot.Core"* ]]; then
                   PROJECT=${{env.MaggsoftOcelotCore}}
                elif [[ "${file}" == *"Maggsoft.Mongo.Services/Maggsoft.Mongo.Services"* ]]; then
                   PROJECT=${{env.MaggsoftMongoServices}}
                elif [[ "${file}" == *"Maggsoft.Mssql.Services/Maggsoft.Mssql.Services"* ]]; then
                   PROJECT=${{env.MaggsoftMssqlServices}}
                elif [[ "${file}" == *"Maggsoft.Npgsql.Services/Maggsoft.Npgsql.Services"* ]]; then
                   PROJECT=${{env.MaggsoftNpgsqlServices}}
                elif [[ "${file}" == *"Maggsoft.Services/Maggsoft.Services"* ]]; then
                   PROJECT=${{env.MaggsoftServices}}
                elif [[ "${file}" == *"Maggsoft.Sqlite.Services/Maggsoft.Sqlite.Services"* ]]; then
                   PROJECT=${{env.MaggsoftSqliteServices}}
                elif [[ "${file}" == *"Maggsoft.Core/Maggsoft.Core"* ]]; then
                   PROJECT=${{env.MaggsoftCore}}
                elif [[ "${file}" == *"Maggsoft.Mongo/Maggsoft.Mongo"* ]]; then
                   PROJECT=${{env.MaggsoftMongo}}
                elif [[ "${file}" == *"Maggsoft.Mssql/Maggsoft.Mssql"* ]]; then
                   PROJECT=${{env.MaggsoftMssql}}
                elif [[ "${file}" == *"Maggsoft.Npgsql/Maggsoft.Npgsql"* ]]; then
                   PROJECT=${{env.MaggsoftNpgsql}}
                elif [[ "${file}" == *"Maggsoft.Sqlite/Maggsoft.Sqlite"* ]]; then
                   PROJECT=${{env.MaggsoftSqlite}}
                elif [[ "${file}" == *"Maggsoft.Framework/Maggsoft.Framework"* ]]; then
                   PROJECT=${{env.MaggsoftFramework}}
                fi
                
                 if [[ "${file}" == *"src/Libraries"* || "${file}" == *"src/Presentation"* ]]; then
                    dotnet restore $PROJECT
                    dotnet build $PROJECT --configuration Release
                    dotnet pack $PROJECT --configuration Release --output  ./nupkgs /p:PackageVersion=$VERSION
                    dotnet nuget push ./nupkgs/*.nupkg --source https://nuget.pkg.github.com/mehmetunal/index.json --api-key ${{ secrets.PACKAGES_TOKEN }} --skip-duplicate
                 fi
            
            done
            echo "Finish..."